<defs>
  <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03060c"/><stop offset="1" stop-color="#071626"/>
  </linearGradient>
  <pattern id="ogrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity=".06"/>
  </pattern>
  <pattern id="olines" width="4" height="4" patternUnits="userSpaceOnUse">
