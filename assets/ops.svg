  </filter>
  <filter id="osoft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <clipPath id="oclip"><rect width="1200" height="340" rx="16"/></clipPath></defs>
<style> text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace; } </style>
