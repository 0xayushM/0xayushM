  .g2 { animation: g2 4.5s infinite steps(1); }
  @keyframes g1 { 0%,88%,100% { opacity:0; transform:translate(0,0); } 89% { opacity:.9; transform:translate(-6px,2px); } 91% { opacity:.8; transform:translate(4px,-2px); } 93% { opacity:0; } 96% { opacity:.7; transform:translate(-3px,0); } 97% { opacity:0; } }
  @keyframes g2 { 0%,88%,100% { opacity:0; transform:translate(0,0); } 89% { opacity:.9; transform:translate(6px,-2px); } 91% { opacity:.8; transform:translate(-4px,2px); } 93% { opacity:0; } 96% { opacity:.7; transform:translate(3px,1px); } 97% { opacity:0; } }
  .role-a { animation: ra 9s infinite; }
  .role-b { animation: rb 9s infinite; }
  @keyframes ra { 0%,62% { opacity:1; } 63%,64% { opacity:.2; } 65%,92% { opacity:0; } 93% { opacity:.4; } 94%,100% { opacity:1; } }
  @keyframes rb { 0%,63% { opacity:0; } 64% { opacity:.6; } 65%,92% { opacity:1; } 93%,100% { opacity:0; } }
  .blink { animation: bl 1s infinite steps(1); }
  @keyframes bl { 50% { opacity:0; } }
</style>
